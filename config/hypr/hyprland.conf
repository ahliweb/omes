# OMES default Hyprland configuration.
#
# Omarchy-inspired (keyboard-first, terminal-first workflow), NOT a copy of
# Omarchy's own Hyprland config - OMES is an independent project and must
# never claim to be Omarchy (see docs/scope.md, docs/branding-and-trademarks.md).
# Installed by modules/desktop-config; back up/restore any edits you make
# here via `omes backup` / `omes restore` (issue #10, not implemented yet)
# or your own copy - this file is registered as an OMES-managed path, so it
# is backed up automatically before any future OMES re-apply overwrites it.
#
# This session is ADDITIVE. Cinnamon remains Linux Mint's default session
# and is never modified by OMES. If Hyprland ever fails to start, log out
# (see the SUPER+SHIFT+E binding below) and pick "Cinnamon" at the LightDM
# login screen - see docs/linux-mint.md "Recovery procedures".

# --- Monitors ----------------------------------------------------------
# Default: let Hyprland auto-configure every detected monitor at its
# preferred resolution/refresh rate. Uncomment and edit for a fixed
# layout (see `hyprctl monitors` after first login for exact names).
monitor=,preferred,auto,1

# --- Autostart -----------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = /usr/local/bin/omes-hyprland-session --polkit-agent-hint

# --- Environment ---------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

# --- Look and feel (kept deliberately minimal; OMES ships no wallpaper) --
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Input -----------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Variables ---------------------------------------------------------
$mod = SUPER
$terminal = foot
$launcher = wofi --show drun
$screenshot_region = grim -g "$(slurp)" - | swappy -f -
$screenshot_full = grim - | swappy -f -

# --- Core keybindings (Omarchy-inspired mod=SUPER, not identical) --------
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exec, /usr/local/bin/omes-hyprland-session --logout
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Screenshots (grim + slurp -> swappy for annotate/save, per docs/scope.md
# non-goal #4: no source builds - all three ship from noble/universe,
# verify per release, see docs/linux-mint.md)
bind = , Print, exec, $screenshot_full
bind = SHIFT, Print, exec, $screenshot_region

# Clipboard history (cliphist; availability verify per release)
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Media / brightness (playerctl, brightnessctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Idle/lock (hypridle/hyprlock - availability verify per release; see
# docs/linux-mint.md "Package availability on noble")
bind = $mod, L, exec, hyprlock

# Focus movement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse-driven move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
