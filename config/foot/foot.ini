# OMES default foot terminal configuration. Omarchy-inspired, not copied.
# Installed by modules/desktop-config at ~/.config/foot/foot.ini.
# foot availability on Ubuntu 24.04 "noble" universe: verify per release
# (see docs/linux-mint.md).

[main]
font=JetBrains Mono:size=11
term=xterm-256color
pad=8x8

[colors]
background=1e1e1e
foreground=e0e0e0

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
