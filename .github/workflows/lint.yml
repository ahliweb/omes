name: Lint

# Runs shell linting, secret scanning, and supply-chain checks on every pull
# request and every push to main. See docs/ci.md for what each job does, how
# to run it locally, and what blocks merge vs. what is advisory.
#
# The core installer (bin/omes, lib/omes/*.sh, modules/, tests/run.sh,
# .shellcheckrc) is tracked separately in issue #6 and may not exist yet on
# this branch. Steps that depend on it are guarded with
# `if: hashFiles(...) != ''` so this workflow works both before and after
# issue #6 merges.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (severity=warning blocks, style is advisory)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/lint.sh shellcheck
        run: ./scripts/lint.sh shellcheck

  shfmt:
    name: shfmt -i 2 -ci -bn (non-blocking)
    runs-on: ubuntu-24.04
    # Non-blocking: the repo's shell formatting style is still being
    # established (see docs/ci.md). This job's failures are advisory only.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/lint.sh shfmt
        run: ./scripts/lint.sh shfmt

  bats:
    name: bats unit + integration (tests/run.sh)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install bats-core
        if: hashFiles('tests/run.sh') != ''
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bats

      - name: Run tests/run.sh
        if: hashFiles('tests/run.sh') != ''
        run: ./tests/run.sh

      - name: tests/run.sh not present yet
        if: hashFiles('tests/run.sh') == ''
        run: |
          echo "tests/run.sh not present yet (core installer #6 not merged); skipping. Tracked in #6."

  gitleaks:
    name: gitleaks (full-history secret scan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ahliweb/omes is a public repo under a personal account, so no
          # GITLEAKS_LICENSE is required (see gitleaks/gitleaks-action docs).
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"

  yamllint:
    name: yamllint (workflows)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/lint.sh yamllint
        run: ./scripts/lint.sh yamllint

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: actionlint (via Docker, pinned by digest)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  supply-chain:
    name: Supply-chain checks (action pinning, curl|bash, download URLs)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/check-supply-chain.sh
        run: ./scripts/check-supply-chain.sh

  check-links:
    name: Relative Markdown link check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/check-links.py
        run: python3 scripts/check-links.py

  check-contracts:
    name: Control Center contract fixtures (scripts/check-contracts.py)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/check-contracts.py
        run: python3 scripts/check-contracts.py
