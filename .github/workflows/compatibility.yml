name: Compatibility

# Runs scripts/test-matrix.sh (issue #15) against the OS containers from
# docs/compatibility-matrix.md on every pull request, every push to main,
# weekly on a schedule, and on demand. The core installer (bin/omes,
# lib/omes/*.sh, modules/, profiles/) is tracked separately in issue #6 and
# may not exist yet on a given branch; the matrix job is guarded with
# `if: hashFiles('scripts/test-matrix.sh') != ''` so this workflow is a
# harmless no-op before that merges. See docs/testing.md for how this
# matrix maps to the compatibility-matrix.md support tiers and how its
# results feed docs/business/release-gates.md.
#
# scripts/test-matrix.sh does its own `docker run`/`docker exec` against
# the target OS images, so this workflow runs it on the GitHub-hosted
# runner directly (Docker preinstalled there) rather than inside a
# `container:` job - nesting Docker inside a `container:` job is not
# supported the same way.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.image }} (tier ${{ matrix.tier }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 (per docs/compatibility-matrix.md section 1): a
          # regression here blocks the release, so these are blocking.
          - image: "ubuntu:24.04"
            tier: "1"
            advisory: false
          - image: "linuxmintd/mint22-amd64"
            tier: "1"
            advisory: false
          # Tier 2: best-effort, tested but not gating by itself.
          - image: "ubuntu:22.04"
            tier: "2"
            advisory: true
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/test-matrix.sh (fresh, rerun, offline, partial-failure, reboot, rollback)
        if: hashFiles('scripts/test-matrix.sh') != ''
        env:
          OMES_MATRIX_IMAGES: ${{ matrix.image }}
        run: ./scripts/test-matrix.sh

      - name: scripts/test-matrix.sh not present yet
        if: hashFiles('scripts/test-matrix.sh') == ''
        run: |
          echo "scripts/test-matrix.sh not present yet; skipping. Tracked in #15."

      - name: Sanitize image name for artifact naming
        if: always()
        id: sanitize
        run: |
          safe="$(printf '%s' '${{ matrix.image }}' | tr ':/' '--')"
          echo "name=${safe}" >> "$GITHUB_OUTPUT"

      - name: Upload tests/matrix/ results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: omes-test-matrix-${{ steps.sanitize.outputs.name }}
          path: |
            tests/matrix/results/
            tests/matrix/logs/
          if-no-files-found: ignore

  real-install-ubuntu-24-04:
    name: Real install + idempotency (ubuntu:24.04, root, apt-base)
    runs-on: ubuntu-24.04
    # BLOCKING as of issue #15: apt-base (#6) is implemented, so a real,
    # non-dry-run install and its idempotent re-run now have an applicable
    # module to prove end-to-end. This duplicates scripts/test-matrix.sh's
    # `fresh`+`rerun` scenarios for ubuntu:24.04 specifically (also run by
    # the `matrix` job above) - kept as its own named, always-blocking job
    # per this issue's brief, rather than folded away, so its pass/fail
    # history stays visible on its own regardless of the broader matrix's
    # advisory/blocking split.
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: scripts/test-matrix.sh (fresh + rerun only)
        if: hashFiles('scripts/test-matrix.sh') != ''
        env:
          OMES_MATRIX_IMAGES: "ubuntu:24.04"
          OMES_MATRIX_SCENARIOS: "fresh rerun"
        run: ./scripts/test-matrix.sh

      - name: scripts/test-matrix.sh not present yet
        if: hashFiles('scripts/test-matrix.sh') == ''
        run: |
          echo "scripts/test-matrix.sh not present yet; skipping. Tracked in #15."

      - name: Upload tests/matrix/ results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: omes-real-install-ubuntu-24.04
          path: |
            tests/matrix/results/
            tests/matrix/logs/
          if-no-files-found: ignore
