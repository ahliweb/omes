name: Upstream Drift Review

# Upstream capability drift review (ADR-0026, issue #181).
# Inspects public upstream releases (Hermes, Omarchy, Graphify, Coolify) against
# architecture/capabilities.json. Manages a single deduplicated tracking issue
# when actionable drift exists.

# Manual-only since issue #312: this workflow no longer runs on the weekly
# schedule it used to. Run it by hand to inspect upstream and to create or update
# the tracking issue (that step needs this workflow's GITHUB_TOKEN):
#   gh workflow run upstream-drift.yml --ref main
# The local, report-only equivalent is scripts/ci-local.sh --job upstream-drift
# (docs/ci.md section 10); it never writes to GitHub.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  drift-review:
    name: Upstream Drift Review (scripts/upstream-drift.py)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        run: |
          python3 --version

      - name: Evaluate Upstream Drift and Reconcile Tracking Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/upstream-drift.py --update-issue
